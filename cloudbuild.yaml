steps:
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['install', '--no-audit', '--no-fund']

  - name: 'node:20'
    entrypoint: 'bash'
    secretEnv: ['GEMINI_API_KEY']
    args:
      - '-c'
      - |
        GEMINI_API_KEY="$$GEMINI_API_KEY" npm run build

  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install -g firebase-tools
        firebase deploy --project=gen-lang-client-0200723670 --only hosting

  # ---------------------------------------------------------------------------
  # Deploy the API/server container to Cloud Run.
  #
  # Why: firebase.json routes /api/** and /run-alerts to the Cloud Run service
  # "service" (europe-west3). Deploying only hosting shipped the UI but left
  # server.ts running old code, so server-side changes never went live.
  #
  # These steps run AFTER the hosting deploy on purpose: if they fail (for
  # example missing IAM roles), hosting has already shipped.
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/alturath-admin-api:$BUILD_ID', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/alturath-admin-api:$BUILD_ID']

  # Only the image is replaced. Existing env vars, secrets, scaling and traffic
  # settings on the service are preserved by Cloud Run.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'service'
      - '--image=gcr.io/$PROJECT_ID/alturath-admin-api:$BUILD_ID'
      - '--region=europe-west3'
      - '--platform=managed'
      - '--quiet'

  # ---------------------------------------------------------------------------
  # Keep the time-based push alerts alive ("not paid after 10 / 30 minutes").
  #
  # Why: Cloud Run gives the API CPU only while a request is in flight and scales
  # it to zero when idle, so the server's own alerts timer stops whenever nobody
  # has the console open. This Cloud Scheduler job calls /api/push/alerts-tick
  # every 5 minutes; each call runs one alerts pass inside the request. Creating
  # it here means nobody has to set it up by hand in the Google Cloud console.
  # Cloud Scheduler's free tier covers 3 jobs per billing account.
  #
  # Never fatal, and it starts with the build (waitFor '-') instead of after the
  # deploy steps, so a failing hosting step cannot keep it from running. Check it at
  # /api/push/alerts-status ("lastTickSource": "cloud-scheduler").
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'alerts-scheduler'
    waitFor: ['-']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        JOB=alturath-alerts-tick
        URI=https://admin.alturathkw.shop/api/push/alerts-tick
        gcloud services enable cloudscheduler.googleapis.com --quiet || echo "WARN: could not enable the Cloud Scheduler API"
        for LOC in europe-west3 europe-west1; do
          if gcloud scheduler jobs describe "$$JOB" --location="$$LOC" >/dev/null 2>&1; then
            gcloud scheduler jobs update http "$$JOB" --location="$$LOC" --schedule='*/5 * * * *' --uri="$$URI" --http-method=GET --attempt-deadline=120s --quiet || echo "WARN: could not update $$JOB"
            gcloud scheduler jobs resume "$$JOB" --location="$$LOC" --quiet >/dev/null 2>&1 || true
            echo "Cloud Scheduler job $$JOB ready in $$LOC"
            exit 0
          fi
        done
        for LOC in europe-west3 europe-west1; do
          if gcloud scheduler jobs create http "$$JOB" --location="$$LOC" --schedule='*/5 * * * *' --uri="$$URI" --http-method=GET --attempt-deadline=120s --quiet; then
            echo "Cloud Scheduler job $$JOB created in $$LOC"
            exit 0
          fi
        done
        echo "WARN: could not create Cloud Scheduler job $$JOB; the GitHub workflow alerts-tick.yml remains the fallback."
        exit 0

timeout: '1800s'

availableSecrets:
  secretManager:
    - versionName: projects/gen-lang-client-0200723670/secrets/GEMINI_API_KEY/versions/latest
      env: GEMINI_API_KEY

options:
  logging: CLOUD_LOGGING_ONLY