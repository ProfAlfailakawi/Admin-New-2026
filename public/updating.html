<!doctype html>
<!--
  صفحة الصيانة — لوحة إدارة التراث.

  أثناء النشر يتبدّل خادم Cloud Run، فتجيب واجهةُ Google الأماميّة بصفحة خطأٍ
  إنجليزية (500/502/503/504) لا يكتبها خادمُنا. عاملُ الخدمة
  (public/firebase-messaging-sw.js، ويستورده public/service-worker.js) يحفظ هذه
  الصفحة عند تثبيته، ويقدّمها بدل أيّ جوابٍ كهذا لتنقّلٍ، أو لانقطاعه والجهازُ متّصل —
  والرابطُ في شريط العنوان يبقى ما طُلب، فإعادةُ التحميل تفتحه هو نفسه.

  الشكل: هيكلُ اللوحة نفسها (الشريط العلوي، بطاقات المؤشرات، الرسم، الجدول) باهتاً
  بانتظار البيانات، وبينها بطاقةُ «إشعار النظام» بأسلوب مكوّنات DNA في التطبيق.

  مستقلّةٌ تماماً: لا طلبَ خارجياً، والخطُّ خطُّ البرنامج (Cairo من /fonts) وإلا
  خطُّ النظام. تسأل /api/health كل ثلاث ثوانٍ (وتتباطأ تدريجياً)، فإذا أجاب أعادت
  فتح الصفحة المطلوبة. وإن عادت الصفحةُ تتعثّر والخادمُ سليم ثلاثَ مرّاتٍ في دقيقتين،
  تباطأت إلى مرّةٍ كل نصف دقيقة ولا تدور في حلقة.
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1a11" media="(prefers-color-scheme: dark)">
<title>صيانة جارية · التراث</title>
<style>
@font-face{font-family:"Cairo";font-weight:200 1000;font-display:swap;src:local("Cairo"),url("/fonts/695c59aa50.woff2") format("woff2")}
/* رموز DNA كما في src/components/dna/dna-theme.css */
:root{
  --canvas:#fbf7ee;--surface:#ffffff;--surface-2:#f8f4ea;
  --ink:#14231a;--muted:#5f6b63;--line:rgba(20,35,26,.09);--line-2:rgba(20,35,26,.16);
  --accent:#0f3d1f;--on-accent:#ffffff;--accent-soft:#e3ece5;
  --warn:#9a6b17;--warn-soft:#f6ecd8;--gold:#d4af37;
  --bone:#ece6d8;--sheen:rgba(255,255,255,.75);
  --shadow:0 1px 2px rgba(20,35,26,.04),0 12px 30px -18px rgba(20,35,26,.2);
  --lift:0 1px 2px rgba(20,35,26,.05),0 26px 60px -28px rgba(15,61,31,.35);
  --bar:rgba(255,255,255,.88);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --canvas:#07140b;--surface:#0f1f14;--surface-2:#13261a;
    --ink:#f2eee2;--muted:#a9b4ab;--line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.15);
    --accent:#d4af37;--on-accent:#0f1f14;--accent-soft:rgba(212,175,55,.14);
    --warn:#e6bf63;--warn-soft:rgba(230,191,99,.13);
    --bone:#1a2d20;--sheen:rgba(255,255,255,.06);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -18px rgba(0,0,0,.7);
    --lift:0 1px 2px rgba(0,0,0,.35),0 26px 60px -24px rgba(0,0,0,.8);
    --bar:rgba(12,26,17,.9);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;background:var(--canvas);color:var(--ink);
  font-family:"Cairo",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;
  font-synthesis:none;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}

/* ---------- الشريط العلوي (admin-app-header) ---------- */
.top{
  position:sticky;top:0;z-index:2;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  min-height:calc(64px + env(safe-area-inset-top,0px));
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
  background:var(--bar);border-bottom:1px solid var(--line);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:38px;height:38px;flex:none;border-radius:12px;box-shadow:var(--shadow)}
.brand b{display:block;font-size:15px;font-weight:800;line-height:1.3}
.brand small{display:block;font-size:12px;font-weight:600;color:var(--muted);line-height:1.3}
.pill{
  display:inline-flex;align-items:center;gap:8px;flex:none;
  min-height:32px;padding:0 12px;border-radius:999px;
  background:var(--warn-soft);color:var(--warn);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 28%,transparent);
  font-size:12.5px;font-weight:750;white-space:nowrap;
}
.dot{position:relative;width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid currentColor;opacity:0;animation:ping 2s var(--ease,ease-out) infinite}

/* ---------- مساحة العمل ---------- */
.desk{
  max-width:1120px;margin:0 auto;
  padding:16px max(16px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;
}
.crumb{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:650;color:var(--muted);margin:2px 2px 2px}
.crumb i{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--line-2)}

/* هيكل البطاقات الباهت */
.ghost{
  position:relative;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
  opacity:.62;
}
.ghost::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 30%,var(--sheen) 50%,transparent 70%);
  transform:translateX(100%);animation:sweep 2.2s ease-in-out infinite;
}
.bone{display:block;border-radius:8px;background:var(--bone)}
.stat{padding:14px;display:grid;gap:10px;min-height:96px}
.stat .chip{width:30px;height:30px;border-radius:10px}
.stat .v{width:62%;height:14px}
.stat .k{width:40%;height:9px;opacity:.7}
.chart{grid-column:1/-1;padding:16px;display:grid;gap:14px;min-height:190px}
.chart .h{width:34%;height:12px}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:6px;border-bottom:1px solid var(--line)}
.bars span{flex:1;border-radius:6px 6px 0 0;background:var(--bone)}
.rows{grid-column:1/-1;padding:6px 16px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .a{width:34px;height:34px;border-radius:50%;flex:none}
.row .t{flex:1;display:grid;gap:7px}
.row .t span:first-child{width:52%;height:10px}
.row .t span:last-child{width:30%;height:8px;opacity:.7}
.row .m{width:54px;height:20px;border-radius:999px;flex:none}

/* ---------- بطاقة إشعار النظام ---------- */
.notice{
  grid-column:1/-1;position:relative;
  background:var(--surface);border:1px solid var(--line-2);border-radius:24px;box-shadow:var(--lift);
  padding:18px 18px 16px;overflow:hidden;
}
.notice::before{content:"";position:absolute;inset-block:18px;inset-inline-start:0;width:3px;border-radius:0 3px 3px 0;background:var(--warn)}
.head{display:flex;align-items:flex-start;gap:12px}
.tile{
  width:42px;height:42px;flex:none;border-radius:14px;display:grid;place-items:center;
  background:var(--warn-soft);color:var(--warn);
}
.tile svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.kicker{margin:0;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:0}
h1{margin:1px 0 0;font-size:19px;font-weight:800;line-height:1.45}
.lead{margin:12px 0 0;font-size:14.5px;line-height:1.85;color:var(--muted)}
.facts{margin:14px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.facts div{padding:9px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.facts dt{font-size:11.5px;font-weight:650;color:var(--muted)}
.facts dd{margin:2px 0 0;font-size:13.5px;font-weight:750}
.foot{
  margin-top:16px;padding-top:14px;border-top:1px dashed var(--line-2);
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 14px;
}
.check{display:grid;gap:1px;min-width:0;font-size:12.5px;line-height:1.6;color:var(--muted)}
.check .when{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.check .when time{direction:ltr;unicode-bidi:isolate}
button{
  font:inherit;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:0 18px;border:0;border-radius:12px;cursor:pointer;
  background:var(--accent);color:var(--on-accent);font-size:14px;font-weight:700;
  box-shadow:0 8px 18px -10px color-mix(in srgb,var(--accent) 80%,transparent);
  transition:background-color .2s ease;
}
button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button:hover{background:color-mix(in srgb,var(--accent) 86%,#000)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

@media (min-width:760px){
  .desk{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding-top:22px}
  .notice{grid-column:span 2;padding:22px 22px 18px}
  .chart{grid-column:span 2;min-height:100%}
  h1{font-size:21px}
}

@keyframes sweep{to{transform:translateX(-100%)}}
@keyframes ping{0%{transform:scale(.6);opacity:.55}80%,100%{transform:scale(1.7);opacity:0}}
@media (prefers-reduced-motion:reduce){
  .ghost::after,.dot::after{animation:none;display:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <!-- علامة التراث كما في public/logo.png وأيقونة التطبيق. -->
    <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">
      <rect width="64" height="64" rx="15" fill="#fbf3df"/>
      <g transform="translate(14.2 10) scale(.0452)">
        <polygon points="190,10 390,165 190,330" fill="#d7102e"/>
        <polygon points="590,10 390,165 590,330" fill="#d7102e"/>
        <polygon points="22,215 185,330 22,470" fill="#d7102e"/>
        <polygon points="767,215 604,330 767,470" fill="#d7102e"/>
        <polygon points="22,515 185,650 22,765" fill="#d7102e"/>
        <polygon points="767,515 604,650 767,765" fill="#d7102e"/>
        <polygon points="190,650 390,805 190,963" fill="#d7102e"/>
        <polygon points="590,650 390,805 590,963" fill="#d7102e"/>
        <polygon points="5,490 390,165 775,490 390,805" fill="#24502c"/>
        <polygon points="195,490 390,320 585,490 390,648" fill="#f6cf5d"/>
      </g>
    </svg>
    <div><b>التراث</b><small>لوحة الإدارة</small></div>
  </div>
  <span class="pill"><span class="dot" aria-hidden="true"></span><span id="pill">صيانة جارية</span></span>
</header>

<main class="desk">
  <p class="crumb" aria-hidden="true">الرئيسية <i></i> نظرة عامة</p>

  <div class="ghost stat" aria-hidden="true"><span class="bone chip"></span><span class="bone v"></span><span class="bone k"></span></div>
  <div class="ghost stat" aria-hidden="true"><span class="bone chip"></span><span class="bone v"></span><span class="bone k"></span></div>
  <div class="ghost stat" aria-hidden="true"><span class="bone chip"></span><span class="bone v"></span><span class="bone k"></span></div>
  <div class="ghost stat" aria-hidden="true"><span class="bone chip"></span><span class="bone v"></span><span class="bone k"></span></div>

  <section class="notice" aria-labelledby="title">
    <div class="head">
      <span class="tile" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      </span>
      <div>
        <p class="kicker">إشعار النظام</p>
        <h1 id="title">يجري تحديث لوحة الإدارة</h1>
      </div>
    </div>
    <p class="lead" id="lead">نثبّت إصداراً جديداً من النظام. البيانات محفوظة ولا يلزم أي إجراء، وستُفتح الصفحة المطلوبة تلقائياً فور اكتمال التحديث.</p>
    <dl class="facts">
      <div><dt>الحالة</dt><dd>تحديث قيد التنفيذ</dd></div>
      <div><dt>البيانات</dt><dd>محفوظة</dd></div>
    </dl>
    <div class="foot">
      <div class="check">
        <span class="when">آخر فحص للخادم: <time id="checked">—</time></span>
        <span id="note" role="status" aria-live="polite">الفحص تلقائي كل بضع ثوانٍ.</span>
      </div>
      <button type="button" id="retry">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        إعادة الفحص الآن
      </button>
    </div>
  </section>

  <div class="ghost chart" aria-hidden="true">
    <span class="bone h"></span>
    <div class="bars"><span style="height:42%"></span><span style="height:64%"></span><span style="height:51%"></span><span style="height:78%"></span><span style="height:60%"></span><span style="height:88%"></span><span style="height:70%"></span></div>
  </div>

  <div class="ghost rows" aria-hidden="true">
    <div class="row"><span class="bone a"></span><span class="t"><span class="bone"></span><span class="bone"></span></span><span class="bone m"></span></div>
    <div class="row"><span class="bone a"></span><span class="t"><span class="bone"></span><span class="bone"></span></span><span class="bone m"></span></div>
    <div class="row"><span class="bone a"></span><span class="t"><span class="bone"></span><span class="bone"></span></span><span class="bone m"></span></div>
  </div>
</main>
<script>
(function () {
  var HEALTH = "/api/health";
  var FIRST = 3000, CEILING = 15000, PATIENT = 30000;
  var KEY = "alturath-updating-reloads";
  var tries = 0, timer = 0, asking = false;
  var title = document.getElementById("title");
  var lead = document.getElementById("lead");
  var note = document.getElementById("note");
  var pill = document.getElementById("pill");
  var checked = document.getElementById("checked");

  /* إعاداتُ التحميل في الدقيقتين الأخيرتين: ثلاثٌ والخادمُ سليم تعني أن الصفحة
     نفسها تتعثّر، فلا ندور في حلقة. */
  function recent() {
    try {
      var now = Date.now();
      return JSON.parse(sessionStorage.getItem(KEY) || "[]").filter(function (t) { return now - t < 120000; });
    } catch (e) { return []; }
  }
  function remember() {
    try { var list = recent(); list.push(Date.now()); sessionStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {}
  }
  function stuck() { return recent().length >= 3; }

  /* فُتحت هذه الصفحة باسمها مباشرة: العودة إلى البداية، لا إليها. */
  function reopen() {
    remember();
    if (location.pathname === "/updating.html") location.replace("/");
    else location.reload();
  }

  /* وقتُ آخر فحص: الصفحةُ نفسها فُتحت لأن الخادم لم يُجب، فذاك أوّل فحص. */
  function stamp() {
    var d = new Date();
    var two = function (n) { return (n < 10 ? "0" : "") + n; };
    checked.textContent = two(d.getHours()) + ":" + two(d.getMinutes()) + ":" + two(d.getSeconds());
  }

  function set(node, text) { if (node.textContent !== text) node.textContent = text; }

  function describe() {
    if (navigator.onLine === false) {
      set(pill, "الجهاز غير متصل");
      set(title, "هذا الجهاز غير متصل بالشبكة");
      set(lead, "تعذّر الوصول إلى لوحة الإدارة من هذا الجهاز. يُستأنف الفحص تلقائياً عند عودة الاتصال، وتُفتح الصفحة المطلوبة دون أي إجراء.");
      set(note, "الفحص متوقف حتى يعود الاتصال.");
    } else if (stuck()) {
      set(pill, "صيانة ممتدة");
      set(title, "يجري تحديث لوحة الإدارة");
      set(lead, "يستغرق التحديث وقتاً أطول من المعتاد. البيانات محفوظة، وستُفتح الصفحة المطلوبة تلقائياً عند اكتماله.");
      set(note, "الفحص التلقائي مرة كل ثلاثين ثانية، ويمكن الفحص يدوياً في أي وقت.");
    } else {
      set(pill, "صيانة جارية");
      set(title, "يجري تحديث لوحة الإدارة");
      set(lead, "نثبّت إصداراً جديداً من النظام. البيانات محفوظة ولا يلزم أي إجراء، وستُفتح الصفحة المطلوبة تلقائياً فور اكتمال التحديث.");
      set(note, "الفحص تلقائي كل بضع ثوانٍ.");
    }
  }

  function wait() {
    if (stuck()) return PATIENT;
    return Math.min(CEILING, Math.round(FIRST * Math.pow(1.3, Math.max(0, tries - 5))));
  }
  function later() { clearTimeout(timer); timer = setTimeout(ask, wait()); }

  function ask() {
    clearTimeout(timer);
    if (asking) return;
    if (navigator.onLine === false) { describe(); later(); return; }
    asking = true;
    tries++;
    var control = typeof AbortController === "function" ? new AbortController() : null;
    var guard = setTimeout(function () { if (control) control.abort(); }, 8000);
    fetch(HEALTH, { cache: "no-store", credentials: "same-origin", signal: control ? control.signal : undefined })
      .then(function (response) { return response.ok; }, function () { return false; })
      .then(function (ok) {
        clearTimeout(guard);
        asking = false;
        stamp();
        if (ok) { reopen(); return; }
        describe();
        later();
      });
  }

  document.getElementById("retry").addEventListener("click", function () {
    if (location.pathname === "/updating.html") location.replace("/");
    else location.reload();
  });
  window.addEventListener("online", function () { describe(); ask(); });
  window.addEventListener("offline", describe);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) ask(); });

  stamp();
  describe();
  later();
})();
</script>
</body>
</html>
