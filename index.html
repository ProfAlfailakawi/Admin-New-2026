    <!-- Pre-boot splash: paints the brand on first paint, before the JS bundle
         downloads and React mounts. Self-contained (no external CSS/fonts), so
         it removes the white gap and matches the OS launch screen (dark manifest
         background). React replaces #root on mount; a safety timeout keeps it
         from ever trapping the UI if the bundle fails to load. -->
    <style>
      #preboot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
          max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        overflow: hidden;
        background-color: #080d12;
        background-image: radial-gradient(circle at 50% 28%, rgba(245, 184, 74, 0.24), transparent 28%),
          radial-gradient(circle at 16% 84%, rgba(16, 185, 129, 0.18), transparent 32%),
          linear-gradient(135deg, #070b10 0%, #111827 52%, #0b1115 100%);
        font-family: "Tajawal", "Cairo", system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #preboot-splash .pb-card {
        position: relative;
        width: 100%;
        max-width: 420px;
        border-radius: 2.2rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.075);
        padding: 34px 28px;
        text-align: center;
        box-shadow: 0 34px 100px rgba(0, 0, 0, 0.42);
        -webkit-backdrop-filter: blur(22px);
        backdrop-filter: blur(22px);
        animation: pb-rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #preboot-splash .pb-top {
        position: absolute;
        left: 2rem;
        right: 2rem;
        top: 0;
        height: 1px;
        background: linear-gradient(to left, transparent, rgba(253, 230, 138, 0.8), transparent);
      }
      #preboot-splash .pb-logo {
        position: relative;
        margin: 0 auto 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 116px;
        width: 116px;
        border-radius: 2rem;
        border: 1px solid rgba(255, 241, 223, 0.25);
        background: linear-gradient(to bottom right, #f8f1df, #efe1bd 45%, #cfb36e);
        box-shadow: 0 18px 55px rgba(245, 184, 74, 0.22);
        animation: pb-pop 0.78s ease-out 0.08s both;
      }
      #preboot-splash .pb-logo::after {
        content: "";
        position: absolute;
        inset: -16px;
        border-radius: 2.6rem;
        border: 1px solid rgba(110, 231, 183, 0.28);
        animation: pb-ring 1.8s ease-in-out infinite;
      }
      #preboot-splash .pb-logo img {
        position: relative;
        z-index: 1;
        height: 80px;
        width: 80px;
        object-fit: contain;
        filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.35));
      }
      #preboot-splash .pb-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 999px;
        border: 1px solid rgba(255, 241, 223, 0.15);
        background: rgba(253, 230, 138, 0.1);
        padding: 8px 16px;
        font-size: 11px;
        font-weight: 800;
        color: #fde8b8;
        animation: pb-fade 0.62s ease-out 0.24s both;
      }
      #preboot-splash .pb-dot {
        height: 8px;
        width: 8px;
        border-radius: 999px;
        background: #6ee7b7;
        box-shadow: 0 0 14px rgba(110, 231, 183, 0.85);
      }
      #preboot-splash .pb-title {
        margin: 16px 0 0;
        font-size: 30px;
        line-height: 1.25;
        font-weight: 900;
        color: #ffffff;
        animation: pb-fade 0.62s ease-out 0.34s both;
      }
      #preboot-splash .pb-rail {
        margin: 26px auto 0;
        height: 6px;
        width: 100%;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
      }
      #preboot-splash .pb-rail span {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(to left, #6ee7b7, #fcd34d, #ffffff);
        box-shadow: 0 0 24px rgba(245, 184, 74, 0.42);
        animation: pb-shimmer 1.4s ease-in-out infinite;
      }
      @keyframes pb-rise {
        from { opacity: 0; transform: translateY(22px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes pb-pop {
        from { opacity: 0; transform: scale(0.86) rotate(-3deg); }
        to { opacity: 1; transform: scale(1) rotate(0); }
      }
      @keyframes pb-fade {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes pb-ring {
        0%, 100% { transform: scale(1); opacity: 0.35; }
        50% { transform: scale(1.08); opacity: 0.05; }
      }
      @keyframes pb-shimmer {
        0% { transform: translateX(150%); }
        100% { transform: translateX(-260%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #preboot-splash .pb-card,
        #preboot-splash .pb-logo,
        #preboot-splash .pb-badge,
        #preboot-splash .pb-title {
          animation: none;
        }
        #preboot-splash .pb-logo::after { animation: none; opacity: 0.28; }
        #preboot-splash .pb-rail span {
          animation: none;
          width: 92%;
          transform: none;
        }
      }
    </style>

    <script>
      // Cloud boot pre-fetch — fired before the JS bundle even downloads.
      // The browser starts the HTTP request to /api/appdata/full?profile=boot at HTML-parse time,
      // so by the time React mounts and the user finishes Google sign-in, the payload is already in flight
      // (and often complete). This warms Cloud Run cold-starts under the cover of normal page load.
      // App.tsx's prewarmCloudBoot() picks up window.__bootPrefetchPromise instead of issuing its own fetch.
      try {
        var __mode = null;
        try { __mode = localStorage.getItem('appMode'); } catch (e) {}
        if (__mode !== 'local') {
          var __ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
          // 9s (was 4.5s): a cold Cloud Run instance needs ~10–40s, so a short abort here
          // killed the very request that was warming it. App.tsx's prewarmCloudBoot() picks
          // up the resilient retry if this one still times out, so we lose nothing by waiting.
          var __timer = setTimeout(function(){ if (__ctrl) __ctrl.abort(); }, 9000);
          window.__bootPrefetchAt = Date.now();
          window.__bootPrefetchPromise = fetch('/api/appdata/full?profile=boot', {
            cache: 'no-store',
            credentials: 'same-origin',
            signal: __ctrl ? __ctrl.signal : undefined
          })
            .then(function(r){ clearTimeout(__timer); return r && r.ok ? r.json() : null; })
            .catch(function(){ clearTimeout(__timer); return null; });
        }
      } catch (e) {}
    </script>
    <script>
      // Service Worker Cleanup: only unregister the OLD generic sw.js
      // (firebase-messaging-sw.js stays untouched for push notifications, and the
      // offline app-shell worker registered from main.tsx is /service-worker.js).
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            if (registration.active && registration.active.scriptURL.includes('sw.js') && !registration.active.scriptURL.includes('firebase-messaging-sw.js')) {
              registration.unregister();
              console.log("Unregistered old SW:", registration);
            }
          }
        });
      }
      // Note: version-aware cache cleanup runs inside App.tsx after a real version change,
      // so we no longer wipe browser caches on every page load (that was killing performance).
    </script>
    <script>
      // Safety net: if the bundle fails to load and React never mounts, don't let
      // the pre-boot splash trap the screen forever.
      window.setTimeout(function () {
        var el = document.getElementById('preboot-splash');
        if (el && el.parentNode) el.parentNode.removeChild(el);
      }, 15000);
    </script>
