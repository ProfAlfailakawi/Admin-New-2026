<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>شركة مطبخ التراث الكويتي</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json?v=8" />
    <link rel="icon" type="image/svg+xml" href="/app-icon-v3.svg?v=8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=8" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-v4.png?v=8" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-title" content="التراث" />
    <meta name="application-name" content="التراث" />
    <meta name="description" content="Turaath AI Business Intelligence Engine" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      // 1. Register Service Worker and manage caches
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((registration) => {
            console.log('SW registered:', registration);
          }).catch((error) => {
            console.log('SW registration failed:', error);
          });
        });
      }

      // 2. Clear all PWA/Browser caches if we encounter older caches
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) {
            if (name !== 'turaath-cache-v8') {
              caches.delete(name);
            }
          }
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
