name: Deploy watchdog

# Read-only. Fails when the live admin site is not serving the latest main.
# It never deploys anything and uses no secrets.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare live build time with main
        env:
          GH_TOKEN: ${{ github.token }}
          GRACE_MINUTES: '45'
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          main_time=$(gh api "repos/${{ github.repository }}/commits/main" --jq .commit.committer.date)
          live=$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://admin.alturathkw.shop/build-id.json?ts=$(date +%s)" || true)
          built_at=$(printf '%s' "$live" | jq -r '.builtAt // empty' 2>/dev/null || true)
          echo "main: $main_sha committed $main_time"
          echo "live: build=$(printf '%s' "$live" | jq -r '.build // "none"' 2>/dev/null) builtAt=${built_at:-none}"
          # A deploy builds after the commit it ships, so live builtAt >= main commit time.
          if [ -n "$built_at" ] && [ "$(date -d "$built_at" +%s)" -ge "$(date -d "$main_time" +%s)" ]; then
            echo "OK: live was built after the latest main commit"; exit 0
          fi
          age=$(( ( $(date +%s) - $(date -d "$main_time" +%s) ) / 60 ))
          if [ "$age" -lt "$GRACE_MINUTES" ]; then
            echo "main is only ${age} min old; within grace period"; exit 0
          fi
          echo "::error::Live site is older than main (builtAt=${built_at:-none}, main committed $main_time, age=${age} min)"
          exit 1
